# Render deployment configuration
# Web deployment for Atlas Canvas

services:
  - type: web
    name: qingchen-atlascloud-canvas
    env: node
    region: singapore
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/status
    buildCommand: npm install --include=dev && npm run build && npm rebuild better-sqlite3 && cd backend && npm install
    startCommand: cd backend && node src/renderServer.js
    envVars:
      - key: ATLASCLOUD_API_KEY
        sync: false
      - key: T8_MEMORY_DEBUG_TOKEN
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: T8_WEB_RUNTIME
        value: 1
      # All mutable Web state lives under one future disk mount. On the Free
      # plan this path is still ephemeral; attach a paid Render disk at
      # /var/data and set T8_PERSISTENT_DISK_CONFIGURED=1 before claiming
      # restart/deploy durability.
      - key: T8PC_DEV_DATA_ROOT
        value: /var/data/t8
      - key: T8PC_FRONTEND_DIST
        value: ../dist
      - key: T8_FIGMA_BRIDGE_AUTOSTART
        value: 0
      - key: T8_ATLAS_ONLY_RUNTIME
        value: 1
      - key: VITE_T8_ATLAS_ONLY_RUNTIME
        value: 1
      - key: T8PC_ASSET_PREVIEW_CONCURRENCY
        value: 1
      - key: ATLAS_ALLOWED_ORIGINS
        value: https://qingchen-atlascloud-canvas.onrender.com
      - key: T8_PUBLIC_ALLOWED_ORIGINS
        value: https://qingchen-atlascloud-canvas.onrender.com
