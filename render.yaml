# Render deployment configuration
# Web deployment for Atlas Canvas

services:
  - type: web
    name: atlas-canvas
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build && cd backend && npm install
    startCommand: cd backend && node src/renderServer.js
    envVars:
      - key: ATLASCLOUD_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
