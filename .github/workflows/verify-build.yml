name: Verify build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atlas-video-clean-ui-repair
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'fix/atlas-video-schema-clean-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply Atlas video and public UI patch
        run: python3 .github/apply_atlas_video_clean_ui.py

      - name: Install, test and build
        run: |
          npm ci --include=dev
          node --test backend/src/providers/atlas.test.js
          npm run build
          grep -RIn '贞贞' src backend public index.html package.json && exit 1 || true

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply_atlas_video_clean_ui.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src backend package.json scripts .github/apply_atlas_video_clean_ui.py .github/inspect-current-ui.cjs
          git commit -m 'fix: correct Atlas reference video payloads and remove legacy UI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
