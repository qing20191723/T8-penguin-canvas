name: Verify build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atlas-video-clean-ui-repair
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'fix/atlas-video-schema-clean-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply Atlas video and public UI patch
        run: |
          python3 .github/apply_atlas_video_clean_ui.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/components/Canvas.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '  const [radialSettingsOpen, setRadialSettingsOpen] = useState(false);'
          if marker not in text:
              raise SystemExit('Canvas compatibility setter insertion marker missing')
          text = text.replace(marker, '  const [, setModelHelpOpen] = useState(false);\n' + marker, 1)
          creator = '          projectId={activeProjectId}\n          canvasId={activeId}'
          if creator not in text:
              raise SystemExit('Creator Agent nullable props marker missing')
          text = text.replace(creator, "          projectId={activeProjectId || ''}\n          canvasId={activeId || ''}", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install, regenerate, test and build
        run: |
          npm ci --include=dev
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'tools/zcanvas-cli/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.providerCatalogDigest = 'da814427d3a0a2894c443a8bce46ef042b4e7a924f449d453065d21984adca86';
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm run feature-sync:generate
          node --test backend/src/providers/atlas.test.js
          npm run build
          grep -RIn '贞贞' src backend public index.html package.json && exit 1 || true

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply_atlas_video_clean_ui.py .github/atlas-video-clean-ui-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src backend package.json scripts tools .github/apply_atlas_video_clean_ui.py .github/inspect-current-ui.cjs .github/atlas-video-clean-ui-trigger.txt .agents
          git commit -m 'fix: correct Atlas reference video payloads and remove legacy UI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
