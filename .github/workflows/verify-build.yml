name: Apply canvas and Atlas repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-build.yml

permissions:
  contents: write

concurrency:
  group: apply-canvas-atlas-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply source repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # 1) React #310: creatorCanvasContext used a hook after an early return.
          canvas_path = 'src/components/Canvas.tsx'
          canvas = read(canvas_path)
          creator_memo = """  const creatorCanvasContext = useMemo(() => buildCreatorCanvasContext(
            nodes,
            edges,
            getViewport(),
            {
              width: typeof window === 'undefined' ? 1440 : window.innerWidth,
              height: typeof window === 'undefined' ? 900 : window.innerHeight,
            },
          ), [edges, getViewport, nodes, viewportMoving]);

          """
          if canvas.count(creator_memo) != 1:
              raise SystemExit('Canvas.tsx: creatorCanvasContext hook marker is missing or duplicated')
          canvas = canvas.replace(creator_memo, '', 1)
          early_return = '  if (!activeId) {\n'
          if canvas.count(early_return) != 1:
              raise SystemExit('Canvas.tsx: activeId early return marker is missing or duplicated')
          canvas = canvas.replace(early_return, creator_memo + early_return, 1)
          write(canvas_path, canvas)

          # 2) The action-bar X must delete the node, not only hide/deselect it.
          replace_once(
              'src/components/NodeActionBar.tsx',
              '在节点右上角外侧出现一条快捷操作栏: 执行 / 中止 / 取消选中',
              '在节点右上角外侧出现一条快捷操作栏: 执行 / 中止 / 删除节点',
          )
          replace_once(
              'src/components/NodeActionBar.tsx',
              '  const { setNodes } = useReactFlow();',
              '  const { setNodes, deleteElements } = useReactFlow();',
          )
          replace_once(
              'src/components/NodeActionBar.tsx',
              """  const onClose = (e: React.MouseEvent) => {
            e.stopPropagation();
            setNodes((nds) => nds.map((n) => (n.id === selectedExe.id ? { ...n, selected: false } : n)));
          };
          """,
              """  const onClose = (e: React.MouseEvent) => {
            e.stopPropagation();
            void deleteElements({ nodes: [selectedExe] });
          };
          """,
          )
          replace_once(
              'src/components/NodeActionBar.tsx',
              '{/* 取消选中 (关闭操作栏) */}',
              '{/* 删除当前节点 */}',
          )
          replace_once(
              'src/components/NodeActionBar.tsx',
              'title="取消选中 (隐藏操作栏)"',
              'title="删除当前节点"',
          )

          # 3) Atlas core API alignment.
          replace_once(
              'backend/src/providers/atlas.js',
              "const DEFAULT_CHAT_BASE_URL = 'https://api.atlascloud.ai/v1';\n",
              '',
          )
          replace_once(
              'backend/src/providers/atlas.js',
              "  return payload?.code == null || String(payload.code) === '200';",
              "  return payload?.code == null || ['0', '200'].includes(String(payload.code));",
          )
          replace_once(
              'backend/src/providers/atlas.js',
              "  const url = String(payload?.data?.download_url || payload?.data?.url || '').trim();",
              "  const url = String(payload?.data?.download_url || payload?.data?.url || payload?.download_url || payload?.url || '').trim();",
          )
          replace_once(
              'backend/src/providers/atlas.js',
              """  const images = refs.slice(0, 4);
            const videos = videoRefs.slice(0, 3);
          """,
              """  const images = refs.slice(0, 4);
            const videos = videoRefs.slice(0, Math.min(3, Math.max(0, 5 - images.length)));
          """,
          )
          replace_once(
              'backend/src/providers/atlas.js',
              """  const durationValue = Number(firstDefined(params.duration, input.duration, input.seconds, 0));
            const duration = durationValue === 0 ? 0 : integerBetween(durationValue, 5, 2, 10);
            return {
              prompt: String(firstDefined(params.prompt, input.prompt, '')).trim(),
              negative_prompt: String(firstDefined(params.negative_prompt, input.negativePrompt, input.negative, '')).trim(),
              video: videoRefs[0],
              ...(refs[0] ? { image: refs[0] } : {}),
              ...(refs.length ? { images: refs.slice(0, 3) } : {}),
          """,
              """  const duration = integerBetween(firstDefined(params.duration, input.duration, input.seconds), 5, 2, 10);
            const primaryImage = refs[0];
            const additionalImages = refs.slice(1, 4);
            return {
              prompt: String(firstDefined(params.prompt, input.prompt, '')).trim(),
              negative_prompt: String(firstDefined(params.negative_prompt, input.negativePrompt, input.negative, '')).trim(),
              video: videoRefs[0],
              ...(primaryImage ? { image: primaryImage } : {}),
              ...(additionalImages.length ? { images: additionalImages } : {}),
          """,
          )
          replace_once(
              'backend/src/providers/atlas.js',
              '    baseUrl: DEFAULT_CHAT_BASE_URL,',
              '    baseUrl: validation.baseUrl,',
          )

          # 4) Keep the official Kling image-to-video model; do not migrate it to Wan.
          for path in [
              'backend/src/providers/registry.js',
              'src/stores/apiKeys.ts',
          ]:
              replace_once(
                  path,
                  "  'kwaivgi/kling-v3.0-std/text-to-video',\n",
                  "  'kwaivgi/kling-v3.0-std/text-to-video',\n  'kwaivgi/kling-v3.0-std/image-to-video',\n",
              )
          replace_once(
              'backend/src/providers/registry.js',
              "  ['kwaivgi/kling-v3.0-std/image-to-video', 'atlascloud/wan-2.7-spicy/image-to-video'],\n",
              '',
          )
          replace_once(
              'src/utils/advancedProviders.ts',
              """      'kwaivgi/kling-v3.0-std/text-to-video',
                'atlascloud/wan-2.7-spicy/image-to-video',
                'alibaba/wan-2.7/reference-to-video',
          """,
              """      'kwaivgi/kling-v3.0-std/text-to-video',
                'kwaivgi/kling-v3.0-std/image-to-video',
                'atlascloud/wan-2.7-spicy/image-to-video',
                'atlascloud/wan-2.7-spicy/reference-to-video',
                'alibaba/wan-2.7/reference-to-video',
          """,
          )

          # 5) Harden the public Atlas proxy for documented code=0/200 and response shapes.
          replace_once(
              'backend/src/routes/atlasProxy.js',
              """const ATLAS_ORIGIN = String(process.env.ATLAS_BASE_URL || 'https://api.atlascloud.ai')
            .trim()
            .replace(/\\/+$/, '');
          const ATLAS_API_ROOT = `${ATLAS_ORIGIN}/api/v1`;
          """,
              """const ATLAS_ORIGIN = String(process.env.ATLAS_BASE_URL || 'https://api.atlascloud.ai')
            .trim()
            .replace(/\\/+$/, '');
          const ATLAS_API_ROOT = ATLAS_ORIGIN.endsWith('/api/v1')
            ? ATLAS_ORIGIN
            : ATLAS_ORIGIN.endsWith('/api')
              ? `${ATLAS_ORIGIN}/v1`
              : `${ATLAS_ORIGIN}/api/v1`;
          """,
          )
          replace_once(
              'backend/src/routes/atlasProxy.js',
              "  return code === undefined || code === null || String(code) === '200';",
              "  return code === undefined || code === null || ['0', '200'].includes(String(code));",
          )
          replace_once(
              'backend/src/routes/atlasProxy.js',
              """function normalizeOutputs(data) {
            const raw = data?.outputs ?? data?.output;
            if (Array.isArray(raw)) return raw.filter((item) => typeof item === 'string' && item.trim());
            if (typeof raw === 'string' && raw.trim()) return [raw.trim()];
            return [];
          }
          """,
              """function normalizeOutputs(data) {
            const values = [
              data?.outputs, data?.output, data?.urls, data?.url,
              data?.image_urls, data?.image_url, data?.imageUrls, data?.imageUrl,
              data?.video_urls, data?.video_url, data?.videoUrls, data?.videoUrl,
              data?.download_url, data?.downloadUrl,
            ];
            const outputs = [];
            for (const value of values) {
              const items = Array.isArray(value) ? value : [value];
              for (const item of items) {
                const url = typeof item === 'string' ? item.trim() : '';
                if (url && !outputs.includes(url)) outputs.push(url);
              }
            }
            return outputs;
          }
          """,
          )
          replace_once(
              'backend/src/routes/atlasProxy.js',
              """    const data = payload?.data || {};
              const predictionId = String(data.id || '').trim();
          """,
              """    const data = isPlainObject(payload?.data)
              ? payload.data
              : (isPlainObject(payload) ? payload : {});
              const predictionId = String(
                data.id || data.prediction_id || data.predictionId || data.task_id || data.taskId || '',
              ).trim();
          """,
          )

          # 6) Update and extend provider regression tests.
          replace_once(
              'backend/src/providers/atlas.test.js',
              "    'kwaivgi/kling-v3.0-std/text-to-video',\n",
              "    'kwaivgi/kling-v3.0-std/text-to-video',\n    'kwaivgi/kling-v3.0-std/image-to-video',\n",
          )
          replace_once(
              'backend/src/providers/atlas.test.js',
              """    images: ['https://example.com/style.png'],
                duration: 0,
          """,
              """    images: [
                'https://example.com/style-primary.png',
                'https://example.com/style-extra.png',
              ],
                duration: 0,
          """,
          )
          replace_once(
              'backend/src/providers/atlas.test.js',
              """      assert.deepEqual(body.images, ['https://example.com/style.png']);
                assert.equal(body.duration, 0);
          """,
              """      assert.equal(body.image, 'https://example.com/style-primary.png');
                assert.deepEqual(body.images, ['https://example.com/style-extra.png']);
                assert.equal(body.duration, 2);
          """,
          )
          replace_once(
              'backend/src/providers/atlas.test.js',
              "  assert.equal(requestedUrl, 'https://api.atlascloud.ai/v1/chat/completions');",
              "  assert.equal(requestedUrl, 'https://api.atlascloud.ai/api/v1/chat/completions');",
          )

          tests_path = 'backend/src/providers/atlas.test.js'
          tests = read(tests_path)
          extra_tests = r'''

          test('Kling v3 image-to-video keeps the official model and maps start/end frames', async () => {
            const result = await atlas.generateVideo(provider, {
              model: 'kwaivgi/kling-v3.0-std/image-to-video',
              prompt: 'a continuous camera move',
              images: [
                'https://example.com/start.png',
                'https://example.com/end.png',
              ],
              duration: 8,
              resolution: '1080P',
            }, {
              fetchImpl: generationFetch((_url, body) => {
                assert.equal(body.model, 'kwaivgi/kling-v3.0-std/image-to-video');
                assert.equal(body.image, 'https://example.com/start.png');
                assert.equal(body.end_image, 'https://example.com/end.png');
                assert.equal(body.duration, 8);
                assert.equal(body.resolution, '1080P');
              }, 'https://example.com/kling-i2v.mp4'),
            });
            assert.equal(result.ok, true);
          });

          test('Alibaba Wan reference-to-video enforces five combined reference materials', async () => {
            const result = await atlas.generateVideo(provider, {
              model: 'alibaba/wan-2.7/reference-to-video',
              prompt: 'keep every character consistent',
              images: [
                'https://example.com/i1.png',
                'https://example.com/i2.png',
                'https://example.com/i3.png',
                'https://example.com/i4.png',
                'https://example.com/i5.png',
              ],
              videos: [
                'https://example.com/v1.mp4',
                'https://example.com/v2.mp4',
              ],
            }, {
              fetchImpl: generationFetch((_url, body) => {
                assert.equal(body.images.length, 4);
                assert.equal(body.videos.length, 1);
                assert.equal(body.images.length + body.videos.length, 5);
              }, 'https://example.com/reference-capped.mp4'),
            });
            assert.equal(result.ok, true);
          });

          test('Atlas accepts documented code zero and top-level media upload URL', async () => {
            const tinyPng = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
            let uploadSeen = false;
            const result = await atlas.generateImage(provider, {
              model: 'bytedance/seedream-v5.0-pro/text-to-image',
              prompt: 'edit the uploaded pixel',
              images: [tinyPng],
            }, {
              fetchImpl: async (url, init = {}) => {
                const requestUrl = String(url);
                if (requestUrl.endsWith('/model/uploadMedia')) {
                  uploadSeen = true;
                  assert.ok(init.body instanceof FormData);
                  return jsonResponse({ code: 0, url: 'https://example.com/uploaded.png' });
                }
                if (requestUrl.includes('/model/prediction/')) {
                  return jsonResponse({ code: 0, data: { status: 'completed', output: 'https://example.com/edited-zero-code.png' } });
                }
                const body = JSON.parse(init.body);
                assert.equal(body.model, 'bytedance/seedream-v5.0-pro/edit');
                assert.deepEqual(body.images, ['https://example.com/uploaded.png']);
                return jsonResponse({ code: 0, data: { id: 'prediction-zero', status: 'processing' } });
              },
            });
            assert.equal(uploadSeen, true);
            assert.equal(result.ok, true);
            assert.deepEqual(result.imageUrls, ['https://example.com/edited-zero-code.png']);
          });
          '''
          if "test('Kling v3 image-to-video keeps the official model" in tests:
              raise SystemExit('atlas.test.js: extra regression tests already present')
          write(tests_path, tests.rstrip() + extra_tests + '\n')
          PY

      - name: Install dependencies
        env:
          T8_WEB_DEPLOY: '1'
        run: npm ci --include=dev

      - name: Run Atlas provider regression tests
        run: node --test backend/src/providers/atlas.test.js

      - name: Build frontend
        run: npm run build

      - name: Restore normal CI and commit verified repair
        shell: bash
        run: |
          cat > .github/workflows/verify-build.yml <<'YAML'
          name: Verify build

          on:
            pull_request:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: verify-build-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Set up Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: '22'
                    cache: npm

                - name: Install dependencies
                  env:
                    T8_WEB_DEPLOY: '1'
                  run: npm ci --include=dev

                - name: Build frontend
                  run: npm run build
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/verify-build.yml \
            src/components/Canvas.tsx \
            src/components/NodeActionBar.tsx \
            src/stores/apiKeys.ts \
            src/utils/advancedProviders.ts \
            backend/src/providers/atlas.js \
            backend/src/providers/atlas.test.js \
            backend/src/providers/registry.js \
            backend/src/routes/atlasProxy.js
          git commit -m 'fix: restore canvas rendering and align Atlas APIs'
          git push origin HEAD:main
