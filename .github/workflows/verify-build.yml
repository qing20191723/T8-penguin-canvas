name: Verify build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          T8_WEB_DEPLOY: '1'
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run build
