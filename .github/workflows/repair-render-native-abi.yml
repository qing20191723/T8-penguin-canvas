name: Repair Render native ABI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-render-native-abi
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'fix/render-native-abi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Patch package lifecycle scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.postinstall = 'node scripts/postinstall.cjs';
          pkg.scripts.prestart = 'node scripts/ensure-node-native.cjs';
          pkg.scripts.start = 'node backend/src/renderServer.js';
          pkg.engines = { ...(pkg.engines || {}), node: '>=22 <23' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install and build as Render
        env:
          RENDER: 'true'
          NODE_ENV: production
        run: |
          npm install --include=dev
          npm run build
          npm --prefix backend install

      - name: Simulate stale Electron ABI cache
        run: npx electron-builder install-app-deps

      - name: Verify prestart repairs ABI and serves production app
        shell: bash
        env:
          RENDER: 'true'
          HOST: 0.0.0.0
          PORT: 10000
          NODE_ENV: production
          T8PC_FRONTEND_DIST: dist
          T8_FIGMA_BRIDGE_AUTOSTART: '0'
          ATLASCLOUD_API_KEY: test-placeholder-key
          ATLAS_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          T8_PUBLIC_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
        run: |
          set -euo pipefail
          yarn start > /tmp/render-native-start.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; cat /tmp/render-native-start.log || true' EXIT
          for attempt in $(seq 1 90); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Server exited before readiness'
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:10000/api/status > /tmp/status.json; then
              cat /tmp/status.json
              curl -fsS --max-time 10 http://127.0.0.1:10000/ | grep -qi '<html\|<!doctype'
              grep -q 'rebuilt successfully for Node.js' /tmp/render-native-start.log
              exit 0
            fi
            sleep 1
          done
          echo 'Server did not become ready'
          exit 1

      - name: Commit verified package repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          if git diff --cached --quiet; then
            echo 'Package lifecycle repair already present.'
            exit 0
          fi
          git commit -m 'fix: preserve Node ABI in Render deployments'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
