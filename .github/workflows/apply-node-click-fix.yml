name: Apply node click fix

on:
  push:
    branches: [fix/node-click-and-remove-rh]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/node-click-and-remove-rh
          fetch-depth: 0

      - name: Apply interaction and sidebar patch
        run: python3 .github/scripts/patch_node_click_remove_rh.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          RENDER: 'true'
        run: npm ci --include=dev

      - name: Build production frontend
        run: npm run build

      - name: Verify changed behavior statically
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const sidebar = fs.readFileSync('src/components/Sidebar.tsx', 'utf8');
          const registry = fs.readFileSync('src/config/nodeRegistry.ts', 'utf8');
          if (!app.includes('waitForAddNodeHandler')) throw new Error('Canvas handler retry missing');
          if (app.includes('pendingSidebarNodeRef')) throw new Error('Stale pending ref still present');
          if (!sidebar.includes("createCanvas('画布 1')")) throw new Error('First canvas auto-create missing');
          if (registry.includes("rh: { label: 'RH'")) throw new Error('RH sidebar group still present');
          console.log('Node click flow and RH removal verified.');
          NODE

      - name: Commit verified product repair
        run: |
          rm -f .github/workflows/apply-node-click-fix.yml
          rm -f .github/workflows/diagnose-live-node-click.yml
          rm -f .github/scripts/patch_node_click_remove_rh.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make sidebar node clicks reliable and remove RH section"
          git push origin HEAD:fix/node-click-and-remove-rh
