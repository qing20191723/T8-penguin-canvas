name: Diagnose live node click

on:
  push:
    branches: [fix/node-click-and-remove-rh]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          mkdir -p /tmp/t8-click-diagnostic
          cd /tmp/t8-click-diagnostic
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Reproduce sidebar click on live site
        working-directory: /tmp/t8-click-diagnostic
        run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = 'https://qingchen-atlascloud-canvas.onrender.com';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1600, height: 1000 } });
          const page = await context.newPage();
          const events = [];
          page.on('console', (msg) => events.push(`console:${msg.type()}: ${msg.text()}`));
          page.on('pageerror', (err) => events.push(`pageerror: ${err.stack || err.message}`));
          page.on('request', (req) => {
            if (req.url().includes('/api/canvas')) events.push(`request: ${req.method()} ${req.url()} body=${req.postData() || ''}`);
          });
          page.on('response', async (res) => {
            if (res.url().includes('/api/canvas')) {
              let body = '';
              try { body = await res.text(); } catch {}
              events.push(`response: ${res.status()} ${res.url()} body=${body.slice(0,1000)}`);
            }
          });
          const response = await page.goto(base, { waitUntil: 'networkidle', timeout: 120000 });
          console.log('root_status=', response?.status());
          await page.waitForSelector('.t8-sidebar-node', { timeout: 60000 });
          const first = page.locator('.t8-sidebar-node').first();
          const firstText = (await first.innerText()).trim();
          const box = await first.boundingBox();
          console.log('first_node=', firstText);
          console.log('first_box=', JSON.stringify(box));
          console.log('first_disabled=', await first.isDisabled());
          console.log('first_visible=', await first.isVisible());
          if (box) {
            const pointInfo = await page.evaluate(({x,y}) => {
              const el = document.elementFromPoint(x,y);
              return el ? { tag: el.tagName, cls: el.className, text: el.textContent?.trim().slice(0,100) } : null;
            }, { x: box.x + box.width / 2, y: box.y + box.height / 2 });
            console.log('element_from_point=', JSON.stringify(pointInfo));
          }
          const beforeHeader = await page.locator('text=/画布\s*\d+/').first().textContent().catch(() => '');
          console.log('before_header=', beforeHeader);
          await first.click({ timeout: 30000 });
          await page.waitForTimeout(8000);
          const afterHeader = await page.locator('text=/画布\s*\d+/').first().textContent().catch(() => '');
          console.log('after_header=', afterHeader);
          console.log('canvas_rows=', await page.locator('.t8-sidebar-canvas-row').count());
          console.log('node_buttons=', await page.locator('.t8-sidebar-node').count());
          console.log('events_begin');
          for (const event of events) console.log(event);
          console.log('events_end');
          await page.screenshot({ path: 'after-click.png', fullPage: true });
          await browser.close();
          EOF
          node diagnose.mjs

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-node-click-diagnostic
          path: /tmp/t8-click-diagnostic/after-click.png
          if-no-files-found: ignore
