name: Apply Atlas dynamic repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/upload-autosize-atlas-pro-models'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/upload-autosize-atlas-pro-models
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact product patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # ---- Front-end provider capabilities and dynamic catalog ----
          replace_once(
              'src/utils/advancedProviders.ts',
              "const LLM_PROTOCOLS = new Set(['openai-compatible', 'modelscope', 'volcengine', 'agnes']);",
              "const LLM_PROTOCOLS = new Set(['openai-compatible', 'modelscope', 'volcengine', 'agnes', 'atlas']);",
          )
          replace_once(
              'src/utils/advancedProviders.ts',
              "    atlas: [\n      'bytedance/seedream-v5.0-lite',\n      'bytedance/seedream-v5.0-lite/edit',\n    ],",
              "    atlas: [\n      'bytedance/seedream-v5.0-pro/text-to-image',\n      'bytedance/seedream-v5.0-pro/edit',\n    ],",
          )
