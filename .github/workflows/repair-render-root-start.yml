name: Repair Render root start

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-render-root-start
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'fix/upload-autosize-atlas-pro-models'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Atlas repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact Atlas repair patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 <<'PY'
          import re
          import subprocess
          import textwrap

          workflow = subprocess.check_output([
              'git', 'show', 'origin/main:.github/workflows/apply-atlas-dynamic-repair.yml'
          ], text=True)
          match = re.search(r"          python3 <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('unable to extract Atlas repair script from approved workflow')
          source = textwrap.dedent(match.group(1))
          exec(compile(source, 'apply-atlas-dynamic-repair.py', 'exec'), {})
          PY

      - name: Install and verify
        run: |
          npm ci --include=dev
          node --test backend/src/providers/atlas.test.js
          npm run build

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src backend .github/atlas-dynamic-repair-trigger.txt
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix: integrate dynamic Atlas catalog and stabilize uploads'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
