name: Apply and verify Atlas-only Qingchen repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: atlas-only-qingchen-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.ref == 'fix/atlas-only-qingchen-config' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-only-qingchen-config
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert verified baseline
        shell: bash
        run: |
          git merge-base --is-ancestor 648d092dfa1ac248a34e47adb6a72b19d0140cea HEAD
          python3 <<'PY'
          import subprocess
          allowed = {'.github/workflows/export-atlas-audit-source.yml'} | {
              f'tools/atlas-patch/part-{index:02d}.txt' for index in range(8)
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '648d092dfa1ac248a34e47adb6a72b19d0140cea', 'HEAD',
          ], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected pre-repair files: {sorted(changed)}')
          PY

      - name: Apply verified product patch
        shell: bash
        run: |
          cat tools/atlas-patch/part-*.txt | tr -d '\r\n' > /tmp/atlas.patch.gz.b64
          echo '2dbcb9477c3166e4f9bf7aebbd44ec8a4f3d5130a8125189d61e14018d8e968c  /tmp/atlas.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/atlas.patch.gz.b64 | gzip --decompress > /tmp/atlas.patch
          echo 'd4d70fd91d32fd6cbd70c7c869bc4d7ab24718a555d1cc3041cb448b0e20c8ab  /tmp/atlas.patch' | sha256sum --check --strict
          git apply --check /tmp/atlas.patch
          git apply /tmp/atlas.patch

      - name: Correct TypeScript Atlas provider defaults
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('src/stores/apiKeys.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'function ensureAtlasAndCustomProviders(settings: ApiSettings): AdvancedProviderConfig[] {',
              'function ensureAtlasAndCustomProviders(settings: { advancedProviders?: AdvancedProviderConfig[] }): AdvancedProviderConfig[] {',
          )
          pattern = re.compile(
              r"  const atlas: AdvancedProviderConfig = \{.*?\n"
              r"  const custom: AdvancedProviderConfig = \{.*?\n"
              r"  \};\n\n"
              r"  return \[atlas, custom\];",
              re.S,
          )
          replacement = '''  const atlas: AdvancedProviderConfig = {
            ...(atlasSource || {}),
            id: 'atlas',
            label: 'Atlas Cloud',
            protocol: 'atlas',
            baseUrl: ATLAS_GENERATION_BASE_URL,
            enabled: true,
            imageModels: Array.isArray(atlasSource?.imageModels) && atlasSource.imageModels.length
              ? atlasSource.imageModels
              : ATLAS_FALLBACK_IMAGE_MODELS,
            videoModels: Array.isArray(atlasSource?.videoModels) && atlasSource.videoModels.length
              ? atlasSource.videoModels
              : ATLAS_FALLBACK_VIDEO_MODELS,
            chatModels: Array.isArray(atlasSource?.chatModels) && atlasSource.chatModels.length
              ? atlasSource.chatModels
              : ATLAS_FALLBACK_CHAT_MODELS,
            defaults: {
              imageModel: ATLAS_FALLBACK_IMAGE_MODELS[0],
              videoModel: ATLAS_FALLBACK_VIDEO_MODELS[0],
              chatModel: ATLAS_FALLBACK_CHAT_MODELS[0],
              pollIntervalMs: 3000,
              ...(atlasSource?.defaults || {}),
            },
          };

          const custom: AdvancedProviderConfig = {
            ...(customSource || {}),
            id: 'custom-api',
            label: customSource?.label || '自定义 API',
            protocol: 'openai-compatible',
            baseUrl: customSource?.baseUrl || '',
            enabled: customSource?.enabled === true,
            imageModels: Array.isArray(customSource?.imageModels) ? customSource.imageModels : [],
            videoModels: Array.isArray(customSource?.videoModels) ? customSource.videoModels : [],
            chatModels: Array.isArray(customSource?.chatModels) ? customSource.chatModels : [],
            defaults: { ...(customSource?.defaults || {}) },
          };

          return [atlas, custom];'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Atlas provider block replacement count: {count}')
          source = source.replace(
              'advancedProviders: ensureAtlasAndCustomProviders({ advancedProviders: [] } as ApiSettings),',
              'advancedProviders: ensureAtlasAndCustomProviders({ advancedProviders: [] }),',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Assert Atlas-only routing and Qingchen naming
        shell: bash
        run: |
          node --check backend/src/config.js
          node --check backend/src/providers/atlas.js
          node --check backend/src/providers/atlasSchema.js
          node --check backend/src/providers/registry.js
          node --check backend/src/routes/atlasProxy.js
          node --check backend/src/routes/settings.js
          python3 <<'PY'
          from pathlib import Path
          files = {
              'ui': Path('src/components/ApiSettings.tsx').read_text(encoding='utf-8'),
              'store': Path('src/stores/apiKeys.ts').read_text(encoding='utf-8'),
              'registry': Path('backend/src/providers/registry.js').read_text(encoding='utf-8'),
              'atlas': Path('backend/src/providers/atlas.js').read_text(encoding='utf-8'),
              'schema': Path('backend/src/providers/atlasSchema.js').read_text(encoding='utf-8'),
              'config': Path('backend/src/config.js').read_text(encoding='utf-8'),
              'canvas': Path('backend/src/routes/canvas.js').read_text(encoding='utf-8'),
          }
          checks = [
              'API Key 设置（Atlas Cloud + 自定义 API）' in files['ui'],
              '所有内置 LLM、图像与视频模型均来自 Atlas Cloud 当前公共模型目录' in files['ui'],
              "id: 'atlas'" in files['store'] and "id: 'custom-api'" in files['store'],
              'return [atlas, custom].filter(Boolean);' in files['registry'],
              "const DEFAULT_BASE_URL = 'https://api.atlascloud.ai/api/v1'" in files['atlas'],
              "const DEFAULT_CHAT_BASE_URL = 'https://api.atlascloud.ai/v1'" in files['atlas'],
              "const ATLAS_MODELS_URL = 'https://api.atlascloud.ai/api/v1/models'" in files['schema'],
              "const ATLAS_STATIC_ORIGIN = 'https://static.atlascloud.ai'" in files['schema'],
              "'qingchen'" in files['config'],
              'qingchen-canvas' in files['canvas'],
          ]
          if not all(checks):
              raise SystemExit(f'Atlas/Qingchen assertion results: {checks}')
          PY

      - name: Verify current Atlas public catalog
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://api.atlascloud.ai/api/v1/models');
          if (!response.ok) throw new Error(`Atlas catalog HTTP ${response.status}`);
          const payload = await response.json();
          const items = Array.isArray(payload?.data) ? payload.data.filter((item) => item?.display_console !== false) : [];
          const counts = items.reduce((acc, item) => {
            const type = String(item?.type || 'other');
            acc[type] = (acc[type] || 0) + 1;
            return acc;
          }, {});
          console.log(JSON.stringify({ visibleModels: items.length, counts }, null, 2));
          if (items.length < 300 || !items.some((x) => x?.type === 'Image') || !items.some((x) => x?.type === 'Video') || !items.some((x) => x?.type === 'Text')) {
            throw new Error('Atlas public catalog is incomplete');
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          T8_WEB_DEPLOY: '1'
        run: npm ci --include=dev

      - name: Regenerate capability artifacts
        run: npm run feature-sync:generate

      - name: Run Atlas regression tests
        run: node --test backend/src/providers/atlas.test.js backend/src/providers/registry.test.js backend/src/providers/atlasSchema.test.js

      - name: Build production frontend
        run: npm run build

      - name: Commit verified product changes
        shell: bash
        run: |
          rm -f .github/workflows/export-atlas-audit-source.yml
          rm -rf tools/atlas-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use Atlas-only models and Qingchen configuration'
          git push origin HEAD:fix/atlas-only-qingchen-config
