name: Export Atlas audit source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.ref == 'fix/atlas-only-qingchen-config' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-only-qingchen-config
          fetch-depth: 1

      - name: Probe Atlas public model catalog
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://api.atlascloud.ai/api/v1/models \
            --output /tmp/atlas-models.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/atlas-models.json', 'utf8'));
          const items = Array.isArray(payload) ? payload : Array.isArray(payload.data) ? payload.data : Array.isArray(payload.items) ? payload.items : [];
          console.log(JSON.stringify({
            topLevelType: Array.isArray(payload) ? 'array' : typeof payload,
            topLevelKeys: payload && !Array.isArray(payload) && typeof payload === 'object' ? Object.keys(payload) : [],
            itemCount: items.length,
            firstItems: items.slice(0, 3),
          }, null, 2));
          if (!items.length) process.exit(2);
          NODE

      - name: Upload Atlas model catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-model-catalog
          path: /tmp/atlas-models.json
          retention-days: 1
