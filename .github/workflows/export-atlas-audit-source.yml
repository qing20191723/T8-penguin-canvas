name: Export Atlas audit source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.ref == 'fix/atlas-only-qingchen-config' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-only-qingchen-config
          fetch-depth: 1

      - name: Download available Atlas public schemas
        shell: bash
        run: |
          mkdir -p /tmp/atlas-schemas/schemas /tmp/atlas-schemas/examples
          curl --fail --silent --show-error --location \
            https://api.atlascloud.ai/api/v1/models \
            --output /tmp/atlas-schemas/models.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const payload = JSON.parse(fs.readFileSync('/tmp/atlas-schemas/models.json', 'utf8'));
          const items = Array.isArray(payload?.data) ? payload.data.filter((item) => item?.display_console !== false) : [];
          const safe = (value) => String(value || '').replace(/[^a-z0-9._-]+/gi, '__').slice(0, 220);
          const queue = [];
          for (const item of items) {
            for (const [field, dir] of [['schema', 'schemas'], ['example', 'examples']]) {
              const url = String(item?.[field] || '').trim();
              if (!url.startsWith('https://static.atlascloud.ai/')) continue;
              queue.push({
                model: String(item.model || ''),
                kind: field,
                url,
                file: path.join('/tmp/atlas-schemas', dir, `${safe(item.model)}.json`),
              });
            }
          }
          let cursor = 0;
          const failures = [];
          let downloaded = 0;
          async function worker() {
            while (cursor < queue.length) {
              const task = queue[cursor++];
              try {
                const response = await fetch(task.url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                fs.writeFileSync(task.file, Buffer.from(await response.arrayBuffer()));
                downloaded += 1;
              } catch (error) {
                failures.push({ model: task.model, kind: task.kind, url: task.url, error: error.message });
              }
            }
          }
          Promise.all(Array.from({ length: 12 }, worker)).then(() => {
            const summary = {
              publicModels: items.length,
              filesRequested: queue.length,
              downloaded,
              failureCount: failures.length,
              failures,
            };
            fs.writeFileSync('/tmp/atlas-schemas/summary.json', JSON.stringify(summary, null, 2));
            console.log(JSON.stringify({
              publicModels: summary.publicModels,
              filesRequested: summary.filesRequested,
              downloaded: summary.downloaded,
              failureCount: summary.failureCount,
            }, null, 2));
          });
          NODE

      - name: Upload Atlas schema audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-schema-audit
          path: /tmp/atlas-schemas
          retention-days: 1
