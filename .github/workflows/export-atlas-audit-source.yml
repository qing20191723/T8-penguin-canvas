name: Apply and verify Atlas-only Qingchen repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: atlas-only-qingchen-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.ref == 'fix/atlas-only-qingchen-config' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-only-qingchen-config
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert exact verified source baseline
        shell: bash
        run: |
          git merge-base --is-ancestor 648d092dfa1ac248a34e47adb6a72b19d0140cea HEAD
          python3 <<'PY'
          import subprocess
          allowed = {'.github/workflows/export-atlas-audit-source.yml'} | {
              f'tools/atlas-patch/part-{index:02d}.txt' for index in range(8)
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '648d092dfa1ac248a34e47adb6a72b19d0140cea', 'HEAD',
          ], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Pre-repair branch contains unexpected files: {sorted(changed)}')
          PY

      - name: Reassemble and verify deterministic patch
        shell: bash
        run: |
          cat tools/atlas-patch/part-*.txt | tr -d '\r\n' > /tmp/atlas-only-qingchen.patch.gz.b64
          echo '2dbcb9477c3166e4f9bf7aebbd44ec8a4f3d5130a8125189d61e14018d8e968c  /tmp/atlas-only-qingchen.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/atlas-only-qingchen.patch.gz.b64 | gzip --decompress > /tmp/atlas-only-qingchen.patch
          echo 'd4d70fd91d32fd6cbd70c7c869bc4d7ab24718a555d1cc3041cb448b0e20c8ab  /tmp/atlas-only-qingchen.patch' | sha256sum --check --strict
          git apply --check /tmp/atlas-only-qingchen.patch
          git apply /tmp/atlas-only-qingchen.patch

      - name: Static Atlas-only and Qingchen assertions
        shell: bash
        run: |
          node --check backend/src/config.js
          node --check backend/src/providers/atlas.js
          node --check backend/src/providers/atlasSchema.js
          node --check backend/src/providers/registry.js
          node --check backend/src/routes/atlasProxy.js
          node --check backend/src/routes/settings.js
          python3 <<'PY'
          from pathlib import Path
          api_settings = Path('src/components/ApiSettings.tsx').read_text(encoding='utf-8')
          store = Path('src/stores/apiKeys.ts').read_text(encoding='utf-8')
          registry = Path('backend/src/providers/registry.js').read_text(encoding='utf-8')
          atlas = Path('backend/src/providers/atlas.js').read_text(encoding='utf-8')
          atlas_schema = Path('backend/src/providers/atlasSchema.js').read_text(encoding='utf-8')
          config = Path('backend/src/config.js').read_text(encoding='utf-8')
          canvas_route = Path('backend/src/routes/canvas.js').read_text(encoding='utf-8')
          assert 'API Key 设置（Atlas Cloud + 自定义 API）' in api_settings
          assert '所有内置 LLM、图像与视频模型均来自 Atlas Cloud 当前公共模型目录' in api_settings
          assert "id: 'atlas'" in store and "id: 'custom-api'" in store
          assert "'openai-compatible',\n  'atlas'," in registry
          assert 'return [atlas, custom].filter(Boolean);' in registry
          assert "const DEFAULT_BASE_URL = 'https://api.atlascloud.ai/api/v1'" in atlas
          assert "const endpoint = kind === 'image' ? '/model/generateImage' : '/model/generateVideo';" in atlas
          assert "const DEFAULT_CHAT_BASE_URL = 'https://api.atlascloud.ai/v1'" in atlas
          assert 'https://static.atlascloud.ai/model/schema/' in atlas_schema
          assert "'qingchen'" in config
          assert 'qingchen-canvas' in canvas_route
          PY

      - name: Verify current official Atlas public catalog
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://api.atlascloud.ai/api/v1/models');
          if (!response.ok) throw new Error(`Atlas catalog HTTP ${response.status}`);
          const payload = await response.json();
          const items = Array.isArray(payload?.data) ? payload.data.filter((item) => item?.display_console !== false) : [];
          const counts = items.reduce((acc, item) => {
            const type = String(item?.type || 'other');
            acc[type] = (acc[type] || 0) + 1;
            return acc;
          }, {});
          console.log(JSON.stringify({ visibleModels: items.length, counts }, null, 2));
          if (items.length < 300) throw new Error(`Unexpected Atlas catalog size: ${items.length}`);
          if (!items.some((item) => item?.type === 'Image')) throw new Error('Atlas Image models missing');
          if (!items.some((item) => item?.type === 'Video')) throw new Error('Atlas Video models missing');
          if (!items.some((item) => item?.type === 'Text')) throw new Error('Atlas Text models missing');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          T8_WEB_DEPLOY: '1'
        run: npm ci --include=dev

      - name: Regenerate authoritative capability artifacts
        run: npm run feature-sync:generate

      - name: Run Atlas routing and schema regression tests
        run: node --test backend/src/providers/atlas.test.js backend/src/providers/registry.test.js backend/src/providers/atlasSchema.test.js

      - name: Build production frontend
        run: npm run build

      - name: Commit only verified product changes
        shell: bash
        run: |
          rm -f .github/workflows/export-atlas-audit-source.yml
          rm -rf tools/atlas-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use Atlas-only models and Qingchen configuration'
          git push origin HEAD:fix/atlas-only-qingchen-config
