name: Inspect Atlas dynamic repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atlas-only-public-ui
  cancel-in-progress: true

jobs:
  inspect:
    if: github.head_ref == 'fix/atlas-only-public-ui-final'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply Atlas-only public UI patch
        run: python3 .github/finalize_atlas_only.py
      - name: Verify Atlas integration and production build
        run: |
          npm ci --include=dev
          node --test backend/src/providers/atlas.test.js
          npm run build
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/finalize_atlas_only.py .github/atlas-only-ui-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src backend .github/finalize_atlas_only.py .github/atlas-only-ui-trigger.txt
          git commit -m 'fix: make public model sources Atlas-only'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
