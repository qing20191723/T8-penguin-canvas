name: Repair and verify Atlas canvas branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repair-atlas-canvas-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.ref == 'fix/atlas-canvas-0eb4879' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-canvas-0eb4879
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert exact 0eb4879 source baseline
        shell: bash
        run: |
          git merge-base --is-ancestor 0eb487960e0e9cb9b9a1dc127d26ef4de7992fe5 HEAD
          python3 <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/repair-atlas-0eb4879.yml',
              '.github/workflows/repair-atlas-pr.yml',
              'tools/repair-atlas-0eb4879.py',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '0eb487960e0e9cb9b9a1dc127d26ef4de7992fe5', 'HEAD',
          ], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected pre-repair changes: {unexpected}')
          if changed != allowed:
              raise SystemExit(f'Expected only the three temporary repair files, got: {sorted(changed)}')
          PY

      - name: Apply deterministic source repair
        run: python3 tools/repair-atlas-0eb4879.py

      - name: Static regression assertions
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          canvas = Path('src/components/Canvas.tsx').read_text(encoding='utf-8')
          hook_index = canvas.index('const creatorCanvasContext = useMemo')
          active_returns = list(re.finditer(r'(?m)^[ \t]*if\s*\(\s*!activeId\s*\)\s*\{', canvas))
          assert active_returns
          assert any(hook_index < match.start() for match in active_returns)
          action = Path('src/components/NodeActionBar.tsx').read_text(encoding='utf-8')
          assert 'deleteElements({ nodes: [selectedExe] })' in action
          registry = Path('backend/src/providers/registry.js').read_text(encoding='utf-8')
          assert "'kwaivgi/kling-v3.0-std/image-to-video'" in registry
          assert "['kwaivgi/kling-v3.0-std/image-to-video', 'atlascloud/wan-2.7-spicy/image-to-video']" not in registry
          atlas = Path('backend/src/providers/atlas.js').read_text(encoding='utf-8')
          assert "['0', '200'].includes(String(payload.code))" in atlas
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          T8_WEB_DEPLOY: '1'
        run: npm ci --include=dev

      - name: Regenerate authoritative capability artifacts
        run: npm run feature-sync:generate

      - name: Run Atlas adapter regression tests
        run: node --test backend/src/providers/atlas.test.js

      - name: Build frontend
        run: npm run build

      - name: Commit verified source changes to repair branch
        shell: bash
        run: |
          rm .github/workflows/repair-atlas-0eb4879.yml
          rm .github/workflows/repair-atlas-pr.yml
          rm tools/repair-atlas-0eb4879.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: repair canvas rendering and Atlas model routing'
          git push origin HEAD:fix/atlas-canvas-0eb4879
