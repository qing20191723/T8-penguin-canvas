name: Inspect bootstrap patch

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 4b06aec1e9741c3fb530e98c6855f70a893ea094
    steps:
      - name: Report bootstrap workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/bootstrap-desktop-postbuild-patch.yml/runs?branch=main&per_page=10" \
            --jq ".workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\") | {id,status,conclusion,event,head_sha,html_url}" | head -n 1
