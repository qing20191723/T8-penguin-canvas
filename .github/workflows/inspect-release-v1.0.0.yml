name: Inspect desktop RH maker bundle imports

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Trace RH toolbox maker definitions and imports
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_ROOTS=(src vite.config.ts electron tests scripts)
          echo '=== exact forbidden markers ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist_electron --exclude='*.map' \
            'RHToolboxMakerNode|RH工具箱制作器|rh-toolbox-maker' "${SEARCH_ROOTS[@]}" || true
          echo '=== broader maker identifiers ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist_electron --exclude='*.map' \
            'rhToolboxMaker|RhToolboxMaker|RH_TOOLBOX_MAKER|toolboxMaker' "${SEARCH_ROOTS[@]}" || true
          echo '=== desktop build constants and aliases ==='
          grep -RInE --exclude-dir=node_modules --exclude='*.map' \
            'VITE_T8_DESKTOP_ATLAS_RUNTIME|T8_DESKTOP_ATLAS_RUNTIME|resolve[[:space:]]*:[[:space:]]*\{|alias[[:space:]]*:' vite.config.ts src electron || true
