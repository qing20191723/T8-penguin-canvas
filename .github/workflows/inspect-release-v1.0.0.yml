name: Inspect v1.0.0 release

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 07f3c2dde335c972660eec64ad26292893a6b316
    steps:
      - name: Dispatch only when fixed SHA has no release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v1.0.0.yml/runs?branch=main&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\") | .id" | head -n 1)
          if [ -z "$existing" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v1.0.0.yml/dispatches" -f ref=main
            echo "Dispatched formal release for ${RELEASE_SHA}."
          else
            echo "Formal release already exists: ${existing}. No duplicate dispatch."
          fi
          sleep 10
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v1.0.0.yml/runs?branch=main&per_page=30" \
            --jq ".workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\") | {id,status,conclusion,event,head_sha,html_url}" | head -n 1
