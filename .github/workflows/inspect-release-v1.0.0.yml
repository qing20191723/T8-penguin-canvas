name: Inspect desktop RH maker bundle imports

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Trace RH toolbox maker definitions and imports
        shell: bash
        run: |
          set -euo pipefail
          echo '=== exact forbidden markers ==='
          rg -n --hidden --glob '!node_modules/**' --glob '!dist/**' --glob '!dist_electron/**' \
            'RHToolboxMakerNode|RH工具箱制作器|rh-toolbox-maker' . || true
          echo '=== broader maker identifiers ==='
          rg -n --hidden --glob '!node_modules/**' --glob '!dist/**' --glob '!dist_electron/**' \
            'rhToolboxMaker|RhToolboxMaker|RH_TOOLBOX_MAKER|toolboxMaker' src vite.config.ts electron tests scripts || true
          echo '=== desktop build constants and aliases ==='
          rg -n --hidden --glob '!node_modules/**' \
            'VITE_T8_DESKTOP_ATLAS_RUNTIME|T8_DESKTOP_ATLAS_RUNTIME|resolve.alias|alias:' vite.config.ts src electron || true
