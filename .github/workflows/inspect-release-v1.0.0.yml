name: Inspect desktop collaboration dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Trace non-collaboration dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo '=== non-collaboration files referencing collaboration modules ==='
          find backend/src -type f \( -name '*.js' -o -name '*.cjs' \) ! -path 'backend/src/collaboration/*' -print0 \
            | xargs -0 grep -nHE "require\(['\"][^'\"]*collaboration|from ['\"][^'\"]*collaboration|routes/collaboration|collaboration/" || true
          echo '=== collaboration protocol exports ==='
          sed -n '1,240p' backend/src/collaboration/protocol.js
          echo '=== desktop/runtime collaboration route registration in server ==='
          grep -nE 'collaboration|DEFAULT_PROJECT_ID|ATLAS_LIGHTWEIGHT_RUNTIME' backend/src/server.js || true
          echo '=== package and encryption filters ==='
          grep -nE 'EXCLUDED_BACKEND|T8_DESKTOP_ATLAS_RUNTIME|collaboration' electron/encrypt.cjs package.json scripts/dist-release.cjs scripts/verify-desktop-atlas-install.cjs || true
