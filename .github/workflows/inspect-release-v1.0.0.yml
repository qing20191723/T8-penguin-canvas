name: Inspect v1.0.0 release

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RENDER_BASE_URL: https://qingchen-atlascloud-canvas.onrender.com
    steps:
      - name: Read formal release workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 342026c10df929d94b98a2aec9fe0aa18d971674
        run: |
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v1.0.0.yml/runs?branch=main&per_page=20" > release-runs.json
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('release-runs.json', 'utf8'));
          const expected = process.env.RELEASE_SHA;
          const runs = Array.isArray(payload.workflow_runs) ? payload.workflow_runs : [];
          const matching = runs.filter((run) => run.head_sha === expected);
          console.log(JSON.stringify({
            expected,
            total: runs.length,
            matching: matching.map((run) => ({
              id: run.id,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url,
            })),
          }, null, 2));
          if (!matching.length) process.exitCode = 2;
          NODE

      - name: Probe Render status and Atlas catalog
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 --max-time 180 \
            -H 'Accept: application/json' \
            "$RENDER_BASE_URL/api/status" | tee render-status.json
          curl --fail-with-body --retry 3 --retry-delay 10 --max-time 180 \
            -H 'Accept: application/json' \
            "$RENDER_BASE_URL/api/proxy/atlas/models" | tee atlas-models.json
          node - <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync('render-status.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync('atlas-models.json', 'utf8'));
          const body = JSON.stringify(catalog).toLowerCase();
          const matches = (catalog.items || []).filter((item) => /kimi[-_/ ]?k?3|wan[-_/ .]?2\.7[-_/ ]?spicy/i.test(JSON.stringify(item)));
          const available = {
            kimiK3: body.includes('kimi-k3') || body.includes('kimi k3'),
            wanSpicy: body.includes('wan-2.7-spicy') || body.includes('wan 2.7 spicy'),
          };
          console.log(JSON.stringify({
            serviceStatus: status.status,
            runtimeProfile: status.runtime?.profile,
            catalogOk: catalog.ok,
            catalogSource: catalog.source,
            catalogTotal: catalog.total,
            available,
            matchingItems: matches.slice(0, 10),
          }, null, 2));
          if (status.status !== 'ok' || status.runtime?.profile !== 'atlas-only') {
            throw new Error('Render is not a healthy Atlas-only runtime');
          }
          if (!catalog.ok) throw new Error('Atlas model catalog did not return ok=true');
          if (!available.kimiK3 || !available.wanSpicy) {
            console.warn('Catalog naming did not match both release aliases; provider dry-run remains authoritative.');
          }
          NODE

      - name: Confirm Render Atlas provider configuration without generation
        run: |
          curl --fail-with-body --max-time 180 \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"providerId":"atlas","dryRun":true,"timeoutMs":60000}' \
            "$RENDER_BASE_URL/api/proxy/external/test-provider" | tee provider-test.json
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('provider-test.json', 'utf8'));
          console.log(JSON.stringify({
            success: payload.success,
            code: payload.code,
            error: payload.error,
            provider: payload.data?.provider,
            configured: payload.data?.configured,
            dryRun: payload.data?.dryRun,
          }, null, 2));
          if (!payload.success || payload.data?.configured !== true || payload.data?.dryRun !== true) {
            throw new Error(payload.error || 'Atlas provider is not configured on Render');
          }
          NODE
