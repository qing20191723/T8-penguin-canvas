name: Verify production startup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-production-startup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Build exactly like Render
        env:
          RENDER: 'true'
          NODE_ENV: production
        run: |
          npm install --include=dev
          npm run build
          npm --prefix backend install

      - name: Start from repository root and verify fast public bootstrap
        shell: bash
        env:
          RENDER: 'true'
          PORT: 10000
          NODE_ENV: production
          T8PC_FRONTEND_DIST: ../dist
          T8_PUBLIC_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          ATLAS_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          ATLASCLOUD_API_KEY: test-placeholder-key
        run: |
          set -euo pipefail
          unset HOST
          unset T8_FIGMA_BRIDGE_AUTOSTART
          yarn start > /tmp/render-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; sleep 1; cat /tmp/render-server.log || true' EXIT

          public_ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Render bootstrap exited before opening the public port"
              cat /tmp/render-server.log
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:10000/api/status > /tmp/bootstrap-status.json; then
              public_ready=1
              break
            fi
            sleep 1
          done
          if [ "$public_ready" != "1" ]; then
            echo "Render public bootstrap did not become reachable"
            cat /tmp/render-server.log
            exit 1
          fi
          cat /tmp/bootstrap-status.json
          grep -q '"success":true' /tmp/bootstrap-status.json
          grep -q '\[render\] public bootstrap listening on http://0.0.0.0:10000' /tmp/render-server.log

          backend_ready=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Render bootstrap exited while waiting for the full backend"
              cat /tmp/render-server.log
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:10000/api/status > /tmp/status.json \
              && grep -q '"phase":"ready"' /tmp/status.json; then
              backend_ready=1
              break
            fi
            echo "Waiting for full T8 backend: attempt=$attempt"
            sleep 1
          done
          if [ "$backend_ready" != "1" ]; then
            echo "Full T8 backend did not become ready"
            cat /tmp/render-server.log
            exit 1
          fi

          cat /tmp/status.json
          curl -fsS --max-time 10 http://127.0.0.1:10000/ > /tmp/root.html
          grep -qi '<!doctype html\|<html' /tmp/root.html
          if grep -q 'T8 无限画布正在启动' /tmp/root.html; then
            echo 'Root page still shows the bootstrap screen after backend readiness.'
            exit 1
          fi
          curl -fsS --max-time 10 http://127.0.0.1:10000/api/settings > /tmp/settings.json
          grep -q '"success":true' /tmp/settings.json
          grep -q '\[render\] serving frontend from' /tmp/render-server.log
          grep -q '\[render\] full T8 backend ready at http://127.0.0.1:10001' /tmp/render-server.log
          if grep -q '\[figma-bridge\] auto-start' /tmp/render-server.log; then
            echo 'Figma Bridge must not auto-start in Render Web deployment.'
            exit 1
          fi
          echo "Fast public bootstrap and full backend verified; root bytes=$(wc -c < /tmp/root.html)"
