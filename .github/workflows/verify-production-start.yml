name: Verify production startup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-production-startup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Build exactly like Render
        env:
          RENDER: 'true'
          NODE_ENV: production
        run: |
          npm install --include=dev
          npm run build
          npm --prefix backend install

      - name: Start from repository root and verify health
        shell: bash
        env:
          RENDER: 'true'
          HOST: 0.0.0.0
          PORT: 10000
          NODE_ENV: production
          T8PC_FRONTEND_DIST: ../dist
          T8_FIGMA_BRIDGE_AUTOSTART: '0'
          T8_PUBLIC_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          ATLAS_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          ATLASCLOUD_API_KEY: test-placeholder-key
        run: |
          set -euo pipefail
          yarn start > /tmp/render-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; cat /tmp/render-server.log || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Production server exited before becoming ready"
              cat /tmp/render-server.log
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:10000/api/status > /tmp/status.json; then
              ready=1
              break
            fi
            echo "Waiting for server: attempt=$attempt"
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Production server did not become ready"
            cat /tmp/render-server.log
            exit 1
          fi
          cat /tmp/status.json
          curl -fsS --max-time 10 http://127.0.0.1:10000/ > /tmp/root.html
          grep -qi '<!doctype html\|<html' /tmp/root.html
          grep -q '\[render\] serving frontend from' /tmp/render-server.log
          echo "Production root startup verified; root bytes=$(wc -c < /tmp/root.html)"
