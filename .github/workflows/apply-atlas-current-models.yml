name: Apply current Atlas models

on:
  push:
    branches: [fix/atlas-current-models]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-atlas-current-models
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[atlas-current-models]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-current-models
          fetch-depth: 0

      - name: Apply Atlas model and schema patch
        run: python3 .github/scripts/patch_atlas_current_models.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          RENDER: 'true'
          NODE_ENV: production
        run: |
          npm install --include=dev
          npm --prefix backend install

      - name: Verify Atlas adapter contracts
        run: |
          node --test backend/src/providers/atlas.test.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { normalizeAdvancedProviders } = require('./backend/src/providers/registry');
          const [atlas] = normalizeAdvancedProviders([{
            id: 'atlas',
            label: 'Atlas Cloud',
            protocol: 'atlas',
            enabled: true,
            baseUrl: 'https://api.atlascloud.ai/api/v1',
            imageModels: [
              'seedream/seedream-v5.0-lite-text-to-image',
              'qwen-image/qwen-image-text-to-image-plus',
            ],
            videoModels: ['kling-video/kling-v3.0-standard-text-to-video'],
            defaults: {
              imageModel: 'seedream/seedream-v5.0-lite-text-to-image',
              videoModel: 'kling-video/kling-v3.0-standard-text-to-video',
            },
          }]).filter((provider) => provider.id === 'atlas');
          assert.equal(atlas.defaults.imageModel, 'bytedance/seedream-v5.0-lite');
          assert.equal(atlas.defaults.videoModel, 'kwaivgi/kling-v3.0-std/text-to-video');
          assert.ok(atlas.imageModels.includes('bytedance/seedream-v5.0-lite/edit'));
          assert.ok(atlas.videoModels.includes('kwaivgi/kling-v3.0-std/image-to-video'));
          assert.ok(!atlas.imageModels.some((model) => model.startsWith('seedream/')));
          assert.ok(!atlas.videoModels.some((model) => model.startsWith('kling-video/')));
          console.log('Saved Atlas provider migration verified');
          NODE

      - name: Build production frontend
        env:
          RENDER: 'true'
          NODE_ENV: production
        run: npm run build

      - name: Verify Render startup and public settings
        shell: bash
        env:
          RENDER: 'true'
          PORT: 10000
          NODE_ENV: production
          T8PC_FRONTEND_DIST: ../dist
          T8_PUBLIC_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          ATLAS_ALLOWED_ORIGINS: https://qingchen-atlascloud-canvas.onrender.com
          ATLASCLOUD_API_KEY: test-placeholder-key
        run: |
          set -euo pipefail
          yarn start > /tmp/atlas-current.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; sleep 1; cat /tmp/atlas-current.log || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:10000/api/status > /tmp/status.json \
              && grep -q '"phase":"ready"' /tmp/status.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS --max-time 10 http://127.0.0.1:10000/api/settings > /tmp/settings.json
          node - <<'NODE'
          const data=require('/tmp/settings.json').data;
          const atlas=(data.advancedProviders||[]).find((provider)=>provider.id==='atlas');
          if(!atlas || !atlas.enabled) throw new Error('Atlas provider not enabled');
          if(atlas.defaults.imageModel!=='bytedance/seedream-v5.0-lite') throw new Error(`bad image default: ${atlas.defaults.imageModel}`);
          if(atlas.defaults.videoModel!=='kwaivgi/kling-v3.0-std/text-to-video') throw new Error(`bad video default: ${atlas.defaults.videoModel}`);
          console.log('Render Atlas defaults verified', atlas.defaults);
          NODE

      - name: Commit verified repair
        run: |
          rm -f .github/workflows/apply-atlas-current-models.yml
          rm -f .github/scripts/patch_atlas_current_models.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: use current Atlas models and schemas [atlas-current-models]"
          git push origin HEAD:fix/atlas-current-models
