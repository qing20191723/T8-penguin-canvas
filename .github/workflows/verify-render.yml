name: Verify Render deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-render-deployment-${{ github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the pushed main commit on Render
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base='https://qingchen-atlascloud-canvas.onrender.com'
          expected="$EXPECTED_COMMIT"
          ready=0
          for attempt in $(seq 1 100); do
            code=$(curl -L -sS -o /tmp/status.json -w '%{http_code}' --max-time 90 "$base/api/status" || true)
            if [ "$code" = '200' ]; then
              observed=$(node -e "const d=require('/tmp/status.json'); process.stdout.write(String(d.commit||''))" 2>/dev/null || true)
              phase=$(node -e "const d=require('/tmp/status.json'); process.stdout.write(String(d.phase||''))" 2>/dev/null || true)
              success=$(node -e "const d=require('/tmp/status.json'); process.stdout.write(String(d.success===true||d.ok===true))" 2>/dev/null || true)
              echo "attempt=$attempt http=$code expected=${expected:0:7} observed=${observed:0:7} phase=$phase success=$success"
              if [[ "$observed" == "$expected"* ]] && [ "$phase" = 'ready' ] && [ "$success" = 'true' ]; then
                ready=1
                break
              fi
            else
              echo "attempt=$attempt http=$code"
            fi
            sleep 15
          done
          test "$ready" = '1'
          cat /tmp/status.json

      - name: Verify Qingchen web application and public canvas writes
        shell: bash
        run: |
          set -euo pipefail
          base='https://qingchen-atlascloud-canvas.onrender.com'
          origin="$base"
          curl -L -fsS --max-time 90 "$base/" > /tmp/root.html
          grep -q '<title>清尘无限画布 · Atlas Cloud</title>' /tmp/root.html
          ! grep -q '<title>贞贞的无限画布' /tmp/root.html

          test_name="live-origin-smoke-$(date +%s)"
          good_code=$(curl -L -sS -o /tmp/canvas-create.json -w '%{http_code}' --max-time 120 \
            -X POST "$base/api/canvas" \
            -H "Origin: $origin" \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"$test_name\"}")
          test "$good_code" = '200'
          canvas_id=$(node -e "const d=require('/tmp/canvas-create.json'); if(!d.success||!d.data?.id) process.exit(1); process.stdout.write(String(d.data.id))")
          cleanup_code=$(curl -L -sS -o /tmp/canvas-delete.json -w '%{http_code}' --max-time 120 \
            -X DELETE "$base/api/canvas/$canvas_id" -H "Origin: $origin")
          test "$cleanup_code" = '200'
          evil_code=$(curl -L -sS -o /tmp/canvas-evil.json -w '%{http_code}' --max-time 120 \
            -X POST "$base/api/canvas" \
            -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' \
            --data '{"name":"must-not-create"}')
          test "$evil_code" = '403'
          echo "Public canvas write verified and cleaned up: $canvas_id"

      - name: Verify dynamic Atlas settings and full model catalog
        shell: bash
        run: |
          set -euo pipefail
          base='https://qingchen-atlascloud-canvas.onrender.com'
          curl -L -fsS --max-time 120 "$base/api/settings" > /tmp/settings.json
          curl -L -fsS --max-time 180 "$base/api/proxy/atlas/models" > /tmp/models.json
          node - <<'NODE'
          const settings=require('/tmp/settings.json').data;
          const providers=settings.advancedProviders||[];
          const atlas=providers.find((provider)=>provider.id==='atlas');
          if(!atlas || !atlas.enabled) throw new Error('Atlas provider is not enabled');
          if(atlas.defaults?.imageModel!=='bytedance/seedream-v5.0-pro/text-to-image') {
            throw new Error(`unexpected image default: ${atlas.defaults?.imageModel}`);
          }
          for(const id of [
            'bytedance/seedream-v5.0-pro/edit',
            'google/nano-banana-pro/text-to-image',
            'google/nano-banana-pro/edit',
            'openai/gpt-image-2/text-to-image',
            'openai/gpt-image-2/edit',
          ]) if(!atlas.imageModels?.includes(id)) throw new Error(`missing image model ${id}`);
          for(const id of [
            'atlascloud/wan-2.7-spicy/image-to-video',
            'alibaba/wan-2.7/reference-to-video',
            'alibaba/wan-2.7/video-edit',
            'bytedance/seedance-2.0/text-to-video',
            'bytedance/seedance-2.0/image-to-video',
            'bytedance/seedance-2.0/reference-to-video',
          ]) if(!atlas.videoModels?.includes(id)) throw new Error(`missing video model ${id}`);

          const catalog=require('/tmp/models.json');
          if(!catalog.success) throw new Error(catalog.error||'Atlas model catalog failed');
          const groups=catalog.models||{};
          const counts={
            image:(groups.Image||[]).length,
            video:(groups.Video||[]).length,
            text:(groups.Text||[]).length,
            audio:(groups.Audio||[]).length,
            other:(groups.Other||[]).length,
            total:Number(catalog.total||0),
          };
          if(counts.image<1) throw new Error('Atlas returned no image models');
          if(counts.video<1) throw new Error('Atlas returned no video models');
          if(counts.text<1) throw new Error(`Atlas public catalog returned no Text/LLM models: ${JSON.stringify(counts)}`);
          require('fs').writeFileSync('/tmp/catalog-counts.json',JSON.stringify(counts));
          const textModels=groups.Text||[];
          const preferred=[
            'deepseek-v3',
            'deepseek/deepseek-v3',
          ];
          const picked=preferred.map(id=>textModels.find(m=>m.id===id)).find(Boolean)
            || textModels.find(m=>/deepseek|qwen|kimi|glm/i.test(`${m.id} ${m.name}`))
            || textModels[0];
          if(!picked?.id) throw new Error('No usable Atlas LLM model found');
          require('fs').writeFileSync('/tmp/llm-model.txt',picked.id);
          console.log('Atlas catalog counts:',counts,'LLM smoke model:',picked.id);
          NODE
          cat /tmp/catalog-counts.json

      - name: Verify public credential boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://qingchen-atlascloud-canvas.onrender.com'
          code=$(curl -L -sS -o /tmp/raw-settings.json -w '%{http_code}' --max-time 90 "$base/api/settings/raw")
          test "$code" = '404'
          node - <<'NODE'
          const text=require('fs').readFileSync('/tmp/settings.json','utf8');
          const payload=JSON.parse(text);
          const providers=payload.data?.advancedProviders||[];
          for(const provider of providers) {
            if(provider.apiKey && !/^\*{4}/.test(provider.apiKey)) throw new Error(`unmasked provider key for ${provider.id}`);
          }
          if(/Bearer\s+\S+|sk-[A-Za-z0-9_-]{12,}/i.test(text)) throw new Error('credential-like value found in public settings');
          NODE
