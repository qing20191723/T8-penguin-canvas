name: Correct Atlas patch assertions

on:
  push:
    branches: [fix/atlas-current-models]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-current-models
          fetch-depth: 0

      - name: Allow legacy IDs only inside the migration map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_atlas_current_models.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "assert OLD_IMAGE not in registry\nassert OLD_IMAGE_2 not in registry\nassert OLD_VIDEO not in registry\n",
              "assert \"const LEGACY_ATLAS_MODEL_IDS = new Map\" in registry\n",
          )
          text = text.replace(
              "for path in [registry_path, frontend_path, atlas_path, verify_path]:",
              "for path in [frontend_path, atlas_path, verify_path]:",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          rm -f .github/workflows/fix-atlas-patch-assertions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: allow legacy Atlas IDs in migration map"
          git push origin HEAD:fix/atlas-current-models
