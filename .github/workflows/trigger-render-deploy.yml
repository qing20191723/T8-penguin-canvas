name: Trigger Render deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trigger-render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.head_ref == 'ci/verify-build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger latest Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            code=$(curl -sS -o /tmp/render-deploy.json -w '%{http_code}' \
              --max-time 60 -X POST "$RENDER_DEPLOY_HOOK_URL")
            cat /tmp/render-deploy.json
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then
              echo "Render deploy hook returned HTTP $code"
              exit 1
            fi
            echo "Render deploy triggered through repository deploy hook."
            exit 0
          fi

          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            code=$(curl -sS -o /tmp/render-deploy.json -w '%{http_code}' \
              --max-time 60 -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{"clearCache":"clear"}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            cat /tmp/render-deploy.json
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
              echo "Render deploy API returned HTTP $code"
              exit 1
            fi
            echo "Render deploy triggered through repository API credentials."
            exit 0
          fi

          echo 'No RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY + RENDER_SERVICE_ID secrets are configured.'
          exit 2
