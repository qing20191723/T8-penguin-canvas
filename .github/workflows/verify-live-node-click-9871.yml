name: Verify live node click 9871

on:
  push:
    branches: [ci/verify-live-node-click-9871]

permissions:
  contents: write

concurrency:
  group: verify-live-node-click-9871
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/verify-live-node-click-9871
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          mkdir -p /tmp/qingchen-live-ui
          cd /tmp/qingchen-live-ui
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Wait for Render and verify real click
        working-directory: /tmp/qingchen-live-ui
        env:
          EXPECTED_COMMIT: 9871a640e4bf8eecf942ea2c6632b40b2b94fecc
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base = 'https://qingchen-atlascloud-canvas.onrender.com';
          const expected = process.env.EXPECTED_COMMIT;
          let status = null;
          for (let attempt = 1; attempt <= 80; attempt += 1) {
            try {
              const response = await fetch(`${base}/api/status`);
              if (response.ok) {
                status = await response.json();
                console.log(`attempt=${attempt} commit=${String(status.commit || '').slice(0,7)} phase=${status.phase}`);
                if (String(status.commit || '').startsWith(expected) && status.phase === 'ready') break;
              }
            } catch (error) {
              console.log(`attempt=${attempt} error=${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          if (!status || !String(status.commit || '').startsWith(expected) || status.phase !== 'ready') {
            throw new Error(`Render did not deploy ${expected.slice(0,7)}: ${JSON.stringify(status)}`);
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1600, height: 1000 } });
          const page = await context.newPage();
          const events = [];
          const network = [];
          page.on('console', (msg) => events.push(`console:${msg.type()}:${msg.text()}`));
          page.on('pageerror', (error) => events.push(`pageerror:${error.stack || error.message}`));
          page.on('request', (request) => {
            if (request.url().includes('/api/canvas')) network.push(`request:${request.method()}:${request.url()}`);
          });
          page.on('response', (response) => {
            if (response.url().includes('/api/canvas')) network.push(`response:${response.status()}:${response.url()}`);
          });

          const testName = `UI点击验收-${Date.now()}`;
          let testCanvasId = '';
          let result = {};
          try {
            const createResponse = await context.request.post(`${base}/api/canvas`, { data: { name: testName } });
            const createJson = await createResponse.json();
            if (!createResponse.ok() || !createJson.success || !createJson.data?.id) {
              throw new Error(`test canvas create failed: ${createResponse.status()} ${JSON.stringify(createJson)}`);
            }
            testCanvasId = createJson.data.id;

            await page.goto(base, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForSelector('.t8-sidebar-node', { timeout: 60000 });
            const row = page.locator('.t8-sidebar-canvas-row').filter({ hasText: testName });
            await row.waitFor({ state: 'visible', timeout: 60000 });
            await row.click();

            const rhGroup = page.locator('button').filter({ hasText: /^RH$/ });
            const rhCount = await rhGroup.count();
            if (rhCount !== 0) throw new Error(`RH group is still visible: count=${rhCount}`);

            const nodeButton = page.locator('.t8-sidebar-node').first();
            const nodeLabel = (await nodeButton.innerText()).trim();
            const beforeText = (await row.innerText()).trim();
            const beforeFlowCount = await page.locator('.react-flow__node').count();
            await nodeButton.click({ timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('.react-flow__node').length > 0, null, { timeout: 15000 });
            const afterText = (await row.innerText()).trim();
            const afterFlowCount = await page.locator('.react-flow__node').count();
            if (afterFlowCount <= beforeFlowCount) {
              throw new Error(`node count did not increase: before=${beforeFlowCount} after=${afterFlowCount}`);
            }
            await page.screenshot({ path: 'verified-click.png', fullPage: true });
            result = {
              success: true,
              deployedCommit: status.commit,
              testCanvasId,
              nodeLabel,
              beforeText,
              afterText,
              beforeFlowCount,
              afterFlowCount,
              rhGroupCount: rhCount,
              events,
              network,
              verifiedAt: new Date().toISOString(),
            };
          } catch (error) {
            await page.screenshot({ path: 'failed-click.png', fullPage: true }).catch(() => {});
            result = {
              success: false,
              deployedCommit: status?.commit || '',
              testCanvasId,
              error: error.stack || error.message,
              events,
              network,
              verifiedAt: new Date().toISOString(),
            };
            throw error;
          } finally {
            if (testCanvasId) {
              const deleteResponse = await context.request.delete(`${base}/api/canvas/${encodeURIComponent(testCanvasId)}`);
              result.cleanupStatus = deleteResponse.status();
            }
            fs.writeFileSync('live-click-result.json', JSON.stringify(result, null, 2));
            await browser.close();
          }
          console.log(JSON.stringify(result, null, 2));
          EOF
          node verify.mjs

      - name: Commit verification result
        if: always()
        run: |
          cp /tmp/qingchen-live-ui/live-click-result.json .github/live-click-result.json 2>/dev/null || true
          cp /tmp/qingchen-live-ui/verified-click.png .github/verified-click.png 2>/dev/null || true
          cp /tmp/qingchen-live-ui/failed-click.png .github/failed-click.png 2>/dev/null || true
          rm -f .github/workflows/verify-live-node-click-9871.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: record live node click verification" || true
          git push origin HEAD:ci/verify-live-node-click-9871
