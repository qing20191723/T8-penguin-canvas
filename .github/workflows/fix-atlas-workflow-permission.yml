name: Separate Atlas product repair

on:
  push:
    branches: [fix/atlas-current-models]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/atlas-current-models
          fetch-depth: 0

      - name: Remove workflow-file mutation from product patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_atlas_current_models.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Update the existing deployment smoke test')
          end = text.index('for path in [frontend_path, atlas_path, verify_path]:')
          replacement = "for path in [frontend_path, atlas_path]:"
          tail_start = end + len('for path in [frontend_path, atlas_path, verify_path]:')
          text = text[:start] + replacement + text[tail_start:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit permission-safe patch
        run: |
          rm -f .github/workflows/fix-atlas-workflow-permission.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: keep Atlas product patch permission-safe"
          git push origin HEAD:fix/atlas-current-models
