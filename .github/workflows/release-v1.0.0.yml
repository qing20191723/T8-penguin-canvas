name: Release v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.0.0.yml'
      - 'scripts/atlas-release-smoke.cjs'
      - 'release-notes/v1.0.0.md'

permissions:
  contents: write

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'qing20191723/T8-penguin-canvas'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      ATLAS_RENDER_BASE_URL: https://qingchen-atlascloud-canvas.onrender.com
      T8_RELEASE_APPROVAL: release-1.0.0
      T8_RELEASE_TARGET: ${{ github.sha }}
      T8_RELEASE_REPO: ${{ github.repository }}
      T8_RELEASE_TAG: v1.0.0

    steps:
      - name: Checkout fixed main SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Preflight Render and Atlas configuration without generation
        shell: pwsh
        run: |
          $status = Invoke-RestMethod -Method Get -Uri "$env:ATLAS_RENDER_BASE_URL/api/status" -TimeoutSec 180
          if ($status.status -ne 'ok' -or $status.runtime.profile -ne 'atlas-only') {
            throw 'Render is not a healthy Atlas-only runtime. No paid request was submitted.'
          }
          $body = @{ providerId = 'atlas'; dryRun = $true; timeoutMs = 60000 } | ConvertTo-Json
          $provider = Invoke-RestMethod -Method Post -Uri "$env:ATLAS_RENDER_BASE_URL/api/proxy/external/test-provider" -ContentType 'application/json' -Body $body -TimeoutSec 180
          if ($provider.success -ne $true -or $provider.data.configured -ne $true -or $provider.data.dryRun -ne $true) {
            throw 'Render Atlas provider dry-run failed. No paid request was submitted.'
          }
          Write-Host 'Render Atlas provider preflight passed without generation.'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release-critical contracts
        run: |
          node --test backend/src/providers/atlas.test.js backend/src/providers/atlasSchema.test.js backend/src/providers/registry.test.js
          node --test tests/desktopAtlasPackaging.test.cjs
          npm run test:electron:ts -- tests/electronUpdater.test.ts
          npm run type-check
          npm run feature-sync:check

      - name: Run exactly one paid Kimi and Wan submission each
        run: node scripts/atlas-release-smoke.cjs

      - name: Preserve paid smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-paid-smoke-v1.0.0-${{ github.sha }}
          path: artifacts/atlas-paid-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Build, seal and publish Windows release
        run: npm run dist:release

      - name: Re-download and verify published release
        run: npm run release:verify

      - name: Report published assets
        shell: pwsh
        run: |
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json tagName,url,targetCommitish,isDraft,isPrerelease,assets
