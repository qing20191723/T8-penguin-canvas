name: Release v1.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.0.0.yml'
      - 'package.json'
      - 'electron/_post_build.cjs'
      - 'scripts/dist-release.cjs'
      - 'scripts/verify-desktop-atlas-install.cjs'
      - 'scripts/atlas-release-smoke.cjs'
      - 'release-notes/v1.0.0.md'

permissions:
  contents: write

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'qing20191723/T8-penguin-canvas'
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: T8-penguin-canvas-release-v1.0.0
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      ATLAS_RENDER_BASE_URL: https://qingchen-atlascloud-canvas.onrender.com
      T8_RELEASE_APPROVAL: release-1.0.0
      T8_RELEASE_TARGET: ${{ github.sha }}
      T8_RELEASE_REPO: ${{ github.repository }}
      T8_RELEASE_TAG: v1.0.0

    steps:
      - name: Checkout fixed main SHA into release worktree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.sha }}
          path: T8-penguin-canvas-release-v1.0.0

      - name: Detach and verify fixed release commit
        shell: pwsh
        run: |
          git checkout --detach $env:T8_RELEASE_TARGET
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -ne $env:T8_RELEASE_TARGET.ToLowerInvariant()) {
            throw "Release checkout mismatch: expected $env:T8_RELEASE_TARGET, got $head"
          }
          node scripts/worktree-role.cjs release

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: T8-penguin-canvas-release-v1.0.0/package-lock.json

      - name: Preflight Render and Atlas connection without generation
        shell: pwsh
        run: |
          $status = $null
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            try {
              $status = Invoke-RestMethod -Method Get -Uri "$env:ATLAS_RENDER_BASE_URL/api/status" -TimeoutSec 180
              if ($status.success -eq $true -and $status.runtime -eq 'atlas-only' -and $status.phase -eq 'ready' -and $status.backendReady -eq $true) {
                break
              }
              Write-Host "Render is not ready yet (attempt $attempt/18): phase=$($status.phase), backendReady=$($status.backendReady), runtime=$($status.runtime)"
            } catch {
              Write-Host "Render status request failed (attempt $attempt/18): $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $status -or $status.success -ne $true -or $status.runtime -ne 'atlas-only' -or $status.phase -ne 'ready' -or $status.backendReady -ne $true) {
            throw "Render is not a healthy Atlas-only runtime. No paid request was submitted. phase=$($status.phase), backendReady=$($status.backendReady), runtime=$($status.runtime)"
          }
          $body = @{ providerId = 'atlas'; dryRun = $true; timeoutMs = 60000 } | ConvertTo-Json
          $provider = Invoke-RestMethod -Method Post -Uri "$env:ATLAS_RENDER_BASE_URL/api/proxy/external/test-provider" -ContentType 'application/json' -Body $body -TimeoutSec 180
          if ($provider.success -ne $true -or $provider.data.ok -ne $true -or $provider.data.protocol -ne 'atlas') {
            throw "Render Atlas connection check failed. No paid request was submitted. code=$($provider.code), error=$($provider.error)"
          }
          Write-Host "Render Atlas connection passed without generation; model count: $($provider.data.modelCount)."

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release-critical contracts
        run: |
          node --test backend/src/providers/atlas.test.js backend/src/providers/atlasSchema.test.js backend/src/providers/registry.test.js
          node --test tests/desktopAtlasPackaging.test.cjs
          npm run test:electron:ts -- tests/electronUpdater.test.ts
          npm run type-check
          npm run feature-sync:check

      - name: Verify previously completed Kimi and Wan evidence
        run: node scripts/atlas-release-smoke.cjs

      - name: Preserve paid smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-paid-smoke-v1.0.0-${{ github.sha }}
          path: ${{ github.workspace }}/T8-penguin-canvas-release-v1.0.0/artifacts/atlas-paid-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Build, seal and publish Windows release
        run: npm run dist:release

      - name: Re-download and verify published release
        run: npm run release:verify

      - name: Report published assets
        shell: pwsh
        run: |
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json tagName,url,targetCommitish,isDraft,isPrerelease,assets
